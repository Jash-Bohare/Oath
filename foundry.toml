[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "read-write", path = "./demo" },
]

[fuzz]
runs = 256

[invariant]
# Invariant suite (test/invariant): random sequences of every action. Use runs = 256, depth = 500 for a deep run.
runs = 64
depth = 200
fail_on_revert = true

[fmt]
line_length = 120

[lint]
# Lint production code; tests intentionally use repeated literals, loops and ignored router returns.
ignore = ["test/**/*.sol"]
