[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "read-write", path = "./demo" },
]

[fuzz]
runs = 256

[fmt]
line_length = 120
