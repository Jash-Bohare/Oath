[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    { access = "read", path = "./test/vectors" },
    { access = "read-write", path = "./demo" },
]

[profile.demo]
# Demo backtest (script/demo/Replay.s.sol): a week of replayed swaps needs more than the default 2^30 gas per
# script run. Run with FOUNDRY_PROFILE=demo; every other setting is the default profile's.
gas_limit = "max"

[fuzz]
runs = 256

[invariant]
# Invariant suite (test/invariant): random sequences of every action. Use runs = 256, depth = 500 for a deep run.
runs = 64
depth = 200
fail_on_revert = true

[rpc_endpoints]
# Fork tests (test/fork) pin their blocks through this endpoint; run them with
# forge test --match-path "test/fork/*" --fork-url $ETH_RPC_URL
mainnet = "${ETH_RPC_URL}"

[fmt]
line_length = 120

[lint]
# Lint production code; tests and the demo scripts (simulation-only fork tooling) intentionally use repeated
# literals, loops, cheatcodes and ignored router returns.
ignore = ["test/**/*.sol", "script/**/*.sol"]
